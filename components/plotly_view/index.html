<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;height:100%;background:#fff;font:13px Arial,Helvetica,sans-serif;color:#1F2A37;overflow:hidden}
#plot{width:100%;height:100%}
#err{display:none;padding:14px;color:#D7263D}
</style>
</head>
<body>
<div id="plot"></div><div id="err"></div>
<script>
"use strict";
function sl(type,data){ window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:type},data||{}),"*"); }
var plotlyReady=false, pending=null, lastKey=null, loading=false;
function showErr(m){ var e=document.getElementById("err"); e.style.display="block"; e.textContent=m; }
function loadPlotly(cb){
  if(window.Plotly){ plotlyReady=true; return cb(); }
  if(loading) return; loading=true;
  var s=document.createElement("script"); s.src="plotly.min.js";
  s.onload=function(){ plotlyReady=true; cb(); };
  s.onerror=function(){ var c=document.createElement("script"); c.src="https://cdn.plot.ly/plotly-2.35.2.min.js";
    c.onload=function(){ plotlyReady=true; cb(); }; c.onerror=function(){ showErr("Plotly.js could not be loaded (no local copy and no internet). Install the 'plotly' Python package so its bundled plotly.min.js can be used."); };
    document.head.appendChild(c); };
  document.head.appendChild(s);
}
function draw(){
  if(!pending) return; var a=pending; pending=null;
  try{ Plotly.react("plot", a.spec.data, a.spec.layout, Object.assign({responsive:true,displaylogo:false}, a.spec.config||{})); }
  catch(e){ showErr("Plot error: "+e.message); }
}
window.addEventListener("message",function(e){
  if(!e.data||e.data.type!=="streamlit:render") return;
  var a=e.data.args||{}; sl("streamlit:setFrameHeight",{height:a.height||520});
  if(a.rev===lastKey) return; lastKey=a.rev; pending=a;
  loadPlotly(draw);
});
window.addEventListener("resize",function(){ if(window.Plotly&&plotlyReady&&document.getElementById("plot").data) Plotly.Plots.resize("plot"); });
sl("streamlit:componentReady",{apiVersion:1});
sl("streamlit:setFrameHeight",{height:520});
</script>
</body>
</html>
